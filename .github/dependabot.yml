version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # Version updates stay paused until the toolchain upgrade lands (#26, #32): every library bump
    # needs the newer AGP/Kotlin first. Security updates are still opened.
    open-pull-requests-limit: 0
    commit-message:
      prefix: build
      include: scope
