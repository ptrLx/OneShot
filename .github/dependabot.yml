# Version updates. Titles must be conventional commits (checked by the PR title workflow) and
# never trigger a release: build(deps) for Gradle, ci(deps) for GitHub Actions.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Toolchain majors change what the F-Droid buildserver must run (Gradle, AGP, Kotlin, JDK):
      # upgrade them by hand together with the CI containers, see docs/modernization/RELEASING.md.
      - dependency-name: com.android.application
        update-types: [version-update:semver-major]
      # The Gradle wrapper belongs to that toolchain and is updated by hand only, after checking
      # which Gradle version the buildserver and AGP support (Gradle 9.6 dropped an API AGP 8 uses).
      - dependency-name: gradle-wrapper
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      # Ceilings below hold back what AGP 8.13 cannot build, while patch and minor updates under
      # them keep flowing. The AndroidX ones declare minCompileSdk=37 and
      # minAndroidGradlePluginVersion=9.1.0 in META-INF/com/android/build/gradle/
      # aar-metadata.properties, so they need AGP 9 and compileSdk 37 together; Kotlin and Hilt are
      # capped by their own coupling. Read that file before raising a ceiling, and note that a
      # ceiling also covers every later major.
      # Kotlin: Hilt 2.58, the last Hilt for AGP 8, reads Kotlin metadata up to 2.3.
      - dependency-name: org.jetbrains.kotlin*
        versions: ['>= 2.4']
      # KSP follows the Kotlin version it was built against.
      - dependency-name: com.google.devtools.ksp*
        versions: ['>= 2.4']
      - dependency-name: com.google.dagger*
        versions: ['>= 2.59']
      - dependency-name: androidx.compose:compose-bom
        versions: ['>= 2026.08.00']
      - dependency-name: androidx.core:core*
        versions: ['>= 1.19']
      - dependency-name: androidx.lifecycle*
        versions: ['>= 2.11']
      - dependency-name: androidx.navigation*
        versions: ['>= 2.10']
      - dependency-name: androidx.hilt:hilt-navigation-compose
        versions: ['>= 1.4']
    groups:
      kotlin:
        patterns: ['org.jetbrains.kotlin*', 'com.google.devtools.ksp*', 'org.jetbrains.kotlinx*']
      compose:
        patterns: ['androidx.compose*']
      androidx:
        patterns: ['androidx.*']
        exclude-patterns: ['androidx.compose*', 'androidx.test*', 'androidx.room*']
      room:
        patterns: ['androidx.room*']
      hilt:
        patterns: ['com.google.dagger*']
      test:
        patterns: ['androidx.test*', 'junit*']
