name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Same JDK major as the F-Droid buildserver (Debian trixie, default OpenJDK 21), see
  # docs/modernization/RELEASING.md. Change it together with the Debian image of the reproducible job.
  JAVA_VERSION: '21'

jobs:
  fdroid-metadata:
    name: F-Droid metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/check-fdroid-metadata.sh

  build:
    name: Build, unit tests, APK checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build and unit test
        run: ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest assembleDebugAndroidTest
      - name: Room schema freeze
        run: scripts/ci/check-schema-freeze.sh
      - name: APK checks
        run: scripts/ci/check-apk.sh app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: app/build/reports/

  reproducible:
    # F-Droid rebuilds every release from source on Debian with Debian's OpenJDK and only publishes
    # our signed OneShot.apk if its own build is identical. Prove that on every change.
    name: Reproducible (F-Droid-like Debian build)
    needs: build
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      volumes:
        - /usr/local/lib/android/sdk:/opt/android-sdk
    env:
      ANDROID_HOME: /opt/android-sdk
    steps:
      - name: Install Debian JDK
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends openjdk-21-jdk-headless git ca-certificates unzip >/dev/null
      - uses: actions/checkout@v7
      - name: Build unsigned release like F-Droid
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: runner-build
      - name: Compare with the runner build
        run: scripts/ci/compare-apks.sh runner-build/release/app-release-unsigned.apk app/build/outputs/apk/release/app-release-unsigned.apk

  signing-dry-run:
    # Signs the unsigned release with a throwaway key exactly like sign-release.yml and checks that
    # F-Droid could transplant the signature onto its own build. Keep the apksigner flags in sync.
    name: Signing dry run (throwaway key)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apks
          path: apks
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Install apksigcopier
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet apksigcopier
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1 >> "$GITHUB_PATH"
      - name: Sign with a throwaway key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/dry-run.p12" -storetype PKCS12 -storepass dry-run \
            -alias dry-run -keyalg RSA -keysize 2048 -validity 1 -dname CN=dry-run
          apksigner sign --alignment-preserved --ks "$RUNNER_TEMP/dry-run.p12" --ks-pass pass:dry-run \
            --ks-key-alias dry-run --key-pass pass:dry-run \
            --out OneShot.apk apks/release/app-release-unsigned.apk
          apksigner verify --print-certs OneShot.apk
      - name: Verify F-Droid can transplant the signature
        run: apksigcopier compare OneShot.apk --unsigned apks/release/app-release-unsigned.apk
