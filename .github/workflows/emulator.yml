name: Emulator

# Instrumented tests on an Android emulator (docs/modernization/TESTING.md, layer 3 and UI tests).
# KVM-accelerated x86_64 emulator on the standard Linux runner, cold booted on every run.
# Not on pull requests: booting two emulators is slow and would block merging. Runs on master and
# on the release branch, and on demand for a branch (`make emulator-run`).
on:
  push:
    branches: [master, 'release-please--branches--master**']
  workflow_dispatch:

concurrency:
  group: emulator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  JAVA_VERSION: '21'

jobs:
  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # minSdk 29
        api-level: [29]
    env:
      EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build app and test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Run instrumented tests
        # Below the 45 minute job timeout, so a stuck emulator fails visibly instead of burning a job.
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          # Cold boot: after loading a snapshot, sys.boot_completed is set before system services
          # such as `input` are back, and the runner's first adb command fails at random.
          emulator-options: -no-snapshot ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: scripts/ci/with-emulator.sh ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-api-${{ matrix.api-level }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
