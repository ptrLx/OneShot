name: Release

# release-please keeps a release PR open (versionName, CHANGELOG.md). This workflow adds what the
# F-Droid flow needs to that PR (versionCode, fastlane changelog). Merging the PR tags vX.Y.Z and
# publishes OneShot.apk, which F-Droid compares against its own reproducible build.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          # PRs opened with GITHUB_TOKEN do not trigger CI. A fine-grained PAT (contents + pull
          # requests: write) in RELEASE_PLEASE_TOKEN makes CI run on the release PR.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  sync-version-code:
    name: Sync versionCode and fastlane changelog
    needs: release-please
    if: needs.release-please.outputs.pr
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - run: scripts/release/sync_version.py
      - name: Commit to the release PR
        run: |
          git add app/build.gradle* fastlane/metadata/android/en-US/changelogs/
          if git diff --cached --quiet; then echo "Already in sync."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync versionCode and fastlane changelog"
          git push

  build-apk:
    name: Build and sign OneShot.apk
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Unsigned F-Droid-like build, then signing in the protected `release` environment.
    # Same image and JDK as the F-Droid buildserver (debian:trixie, default OpenJDK 21).
    uses: ./.github/workflows/sign-release.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}
      image: debian:trixie
      jdk: '21'

  publish-apk:
    name: Attach OneShot.apk to the release
    needs: [release-please, build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: OneShot-release
      - name: Upload (asset name is fixed by the F-Droid Binaries URL)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" OneShot.apk --clobber -R "$GITHUB_REPOSITORY"
