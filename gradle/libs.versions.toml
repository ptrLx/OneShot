[versions]
agp = "8.13.2"
# Kotlin 2.3: Hilt 2.58 (last Hilt for AGP 8) reads Kotlin metadata up to 2.3.
kotlin = "2.3.21"
ksp = "2.3.12"
hilt = "2.58"
room = "2.8.5"
# Newest BOM whose Compose 1.11 still builds with AGP 8 and compileSdk 36.
compose-bom = "2026.06.01"
lifecycle = "2.10.0"
coroutines = "1.11.0"

[libraries]
androidx-core-ktx = "androidx.core:core-ktx:1.18.0"
androidx-core-splashscreen = "androidx.core:core-splashscreen:1.2.0"
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-documentfile = "androidx.documentfile:documentfile:1.1.0"

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material = { module = "androidx.compose.material:material" }
# Since Compose Material 1.7 the icons are no longer a transitive dependency.
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-activity-compose = "androidx.activity:activity-compose:1.13.0"
androidx-navigation-compose = "androidx.navigation:navigation-compose:2.9.8"
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

androidx-datastore-preferences = "androidx.datastore:datastore-preferences:1.2.1"

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0"

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = "androidx.hilt:hilt-navigation-compose:1.3.0"

coil-compose = "io.coil-kt:coil-compose:2.7.0"

junit = "junit:junit:4.13.2"
androidx-test-ext-junit = "androidx.test.ext:junit:1.3.0"
androidx-test-espresso-core = "androidx.test.espresso:espresso-core:3.7.0"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
